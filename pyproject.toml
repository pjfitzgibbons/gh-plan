[project]
name = "gh-plan"
version = "0.0.0"
description = "A planning layer over GitHub Issues: estimates, lanes, dependencies and baselines."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.1",
    "ruamel-yaml>=0.19.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ghplan"

[tool.pytest.ini_options]
# The hook's and the gh-issues scripts' suites are plain unittest; pytest collects them so one
# command runs everything.
testpaths = ["tests", ".claude/hooks", ".claude/skills/gh-issues/scripts"]
# -ra: end-of-run summary naming every skip, xfail and failure, so nothing passes silently.
addopts = ["-ra", "--strict-markers", "--strict-config", "--cov", "--cov-report=term"]
xfail_strict = true

[tool.coverage.run]
source = ["ghplan"]
branch = true

[tool.coverage.report]
# Below this, pytest exits non-zero: the CI check goes red, locally too.
fail_under = 90
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "pytest-md-report>=0.8.0",
    "pyyaml>=6.0.3",
]
