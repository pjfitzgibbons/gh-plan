[project]
name = "gh-plan"
version = "0.0.0"
description = "The Python around GH Plan: Redmine's backup, the attribution hook and the gh-issues scripts."
requires-python = ">=3.14"
dependencies = []

[tool.uv]
# Nothing to build or install: the project only holds the test environment.
package = false

[tool.pytest.ini_options]
# The hook's and the skill scripts' suites are plain unittest; pytest collects them so one
# command runs everything.
testpaths = ["tests", ".claude/hooks", ".claude/skills/gh-issues/scripts", ".claude/skills/plan-report/scripts"]
# -ra: end-of-run summary naming every skip, xfail and failure, so nothing passes silently.
addopts = ["-ra", "--strict-markers", "--strict-config", "--cov", "--cov-report=term"]
xfail_strict = true

[tool.coverage.run]
source = ["redmine", ".claude/hooks"]
omit = ["*/test_*.py"]
branch = true

[tool.coverage.report]
# Below this, pytest exits non-zero: the CI check goes red, locally too.
fail_under = 90
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "pytest-md-report>=0.8.0",
    "ruff>=0.17.2",
]

[tool.ruff]
# Set here so no ruff config in a parent directory or the home directory applies.
line-length = 100
# Not requires-python: the scripts run under any python3 on PATH, 3.10 or newer (pr.sh checks),
# and launchd runs backup.py with /usr/bin/python3, 3.9. scripts/assess, and so review.py, needs
# 3.14, but assess keeps to 3.10's syntax so an older Python reaches its version check. Fixes and
# the format keep to those.
target-version = "py310"
per-file-target-version = { "redmine/backup.py" = "py39" }
# The script folders import each other by bare name: their modules are first-party.
src = [".", ".claude/hooks", ".claude/skills/gh-issues/scripts", ".claude/skills/plan-report/scripts"]
# Python scripts without a .py name, which ruff would otherwise skip.
extend-include = ["scripts/assess"]

[tool.ruff.format]
# The docs' Python blocks are laid out by hand, aligned comments and all.
exclude = ["*.md"]

[tool.ruff.lint]
# Ruff's defaults, plus import order (I), pyupgrade (UP) and bugbear (B).
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# One line per module, "as" names included.
combine-as-imports = true
